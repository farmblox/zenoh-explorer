# License choices for the native binary. Order matters: for dual-licensed
# crates, cargo-about selects the first compatible option.
accepted = [
  "Apache-2.0",
  "MIT",
  "0BSD",
  "MIT-0",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "Unicode-3.0",
  "Unlicense",
  "MPL-2.0",
  "Apache-2.0 WITH LLVM-exception",
]

targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]

ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
workarounds = ["ring", "rustls", "rustix"]
private = { ignore = true }

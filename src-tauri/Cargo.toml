[package]
name = "zenoh-explorer"
description = "A modern explorer for Zenoh networks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# Tauri compiles the app as a library on mobile, so all real code lives in
# `lib.rs` and `main.rs` is a two-line shim. See
# https://v2.tauri.app/start/project-structure/
[lib]
name = "zenoh_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[features]
default = []
# Ships the in-app updater. Off by default because the updater plugin refuses to
# initialise without a signing public key in `tauri.conf.json`.
updater = ["dep:tauri-plugin-updater", "dep:tauri-plugin-process"]
# Builds the WebDriver hooks the end-to-end suite drives. Never enable this for
# a release: it embeds a WebDriver server that can execute arbitrary JavaScript
# in the app, which is exactly what you want in CI and never anywhere else.
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# --- our own domain plugins -------------------------------------------------
tauri-plugin-zenoh-session = { path = "../crates/tauri-plugin-zenoh-session" }
tauri-plugin-zenoh-topology = { path = "../crates/tauri-plugin-zenoh-topology" }
tauri-plugin-zenoh-keyspace = { path = "../crates/tauri-plugin-zenoh-keyspace" }
tauri-plugin-zenoh-data = { path = "../crates/tauri-plugin-zenoh-data" }
tauri-plugin-zenoh-profiles = { path = "../crates/tauri-plugin-zenoh-profiles" }

# --- tauri ------------------------------------------------------------------
tauri = { version = "2.11", features = ["macos-private-api", "devtools", "tray-icon", "image-png"] }

# --- official plugins, each tied to a feature the explorer actually has ------
tauri-plugin-clipboard-manager = "2.3"  # copy a zid, key expression or payload
tauri-plugin-dialog = "2.7"             # choose where to export a tap
tauri-plugin-fs = "2.5"                 # write the export, read a zenoh config
tauri-plugin-log = "2.9"                # rotating log file + webview console
tauri-plugin-notification = "2.4"       # tell the user a node dropped
tauri-plugin-opener = "2.5"             # open zenoh.io docs from the key-expr help
tauri-plugin-os = "2.3"                 # render the right modifier glyphs
tauri-plugin-persisted-scope = "2.3"    # remember granted fs scopes across restarts
tauri-plugin-store = "2.4"              # connection profiles and preferences

serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# The log plugin's filters are expressed with `log`'s own level type.
log = "0.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.3"    # summon the window from anywhere
tauri-plugin-single-instance = "2.4"    # one explorer; forward deep links to it
tauri-plugin-deep-link = "2.4"          # zenoh-explorer://connect?endpoint=...
tauri-plugin-window-state = "2.4"       # remember window geometry
tauri-plugin-updater = { version = "2.11", optional = true }
tauri-plugin-process = { version = "2.3", optional = true }
# End-to-end testing only; gated behind the `e2e` feature.
tauri-plugin-wdio = { version = "1.3", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.3", optional = true }

[dev-dependencies]
# `tauri::test` runs a real App on a mock runtime: no window, no display server,
# and it works on macOS where WebDriver does not. The tests live here rather
# than in the plugin crates because the ACL that authorises a command is
# generated from this crate's `capabilities/`, so this is the only place a
# command can be invoked the way the webview invokes it.
tauri = { version = "2.11", features = ["test"] }

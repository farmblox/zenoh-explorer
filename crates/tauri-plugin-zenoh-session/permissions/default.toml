"$schema" = "schemas/schema.json"

[default]
description = """
Full access to session lifecycle: opening and closing connections to Zenoh
networks and reading which sessions are open. The explorer's whole purpose is
inspecting networks the user chooses, so every command here is in the default
set.
"""
permissions = [
  "allow-connect",
  "allow-disconnect",
  "allow-list-sessions",
  "allow-session-summary",
  "allow-transports",
]

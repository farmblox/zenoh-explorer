[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# GPL, AGPL, LGPL, and EPL are intentionally absent. Dependencies offering one
# of those licenses must also offer an allowed option; Zenoh is therefore
# selected under Apache-2.0 and r-efi under 0BSD/MIT.

[licenses.private]
ignore = true

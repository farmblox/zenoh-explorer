name: Release

on:
  push:
    tags: ["v*"]
  # Cut a tagged release directly from the selected branch.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  preflight:
    name: Release credentials
    runs-on: ubuntu-latest
    steps:
      - name: Require updater and Apple signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          missing=0
          for name in \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_API_ISSUER \
            APPLE_API_KEY \
            APPLE_API_KEY_CONTENT
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

  licenses:
    name: Distribution licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2,cargo-deny@0.20.2
      - run: pnpm licenses:check

  release:
    name: ${{ matrix.label }}
    needs: [preflight, licenses]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon and Intel are built separately rather than as a
          # universal binary: two smaller downloads, and a failure on one arch
          # does not block the other.
          - os: macos-latest
            label: macOS (Apple Silicon)
            target: aarch64-apple-darwin
          - os: macos-latest
            label: macOS (Intel)
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            label: Linux
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            label: Windows
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Tauri system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev

      # Tauri's bundler downloads linuxdeploy into the cache directory the
      # first time it runs and reuses whatever is there afterwards, so a copy
      # put there beforehand is the copy it uses. The one it would fetch is a
      # July 2024 build whose exclude list still lets libwayland-client into
      # the AppImage, and an AppImage carrying Ubuntu's libwayland-client
      # cannot create an EGL display on a host with Mesa 25 or newer: the web
      # process aborts and the window never appears. Upstream's current build
      # leaves that library to the host. See docs/releasing.md.
      - name: Use a linuxdeploy that leaves libwayland-client to the host
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          arch="${{ matrix.target }}"
          arch="${arch%%-*}"
          tools="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$tools"
          curl -fsSL -o "$tools/linuxdeploy-$arch.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-$arch.AppImage"
          chmod +x "$tools/linuxdeploy-$arch.AppImage"
          "$tools/linuxdeploy-$arch.AppImage" --appimage-extract-and-run --version

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Import Apple Developer ID certificate
        if: startsWith(matrix.os, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/zenoh-explorer-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          CERT_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$CERT_IDENTITY" ]; then
            echo "::error::The imported certificate is not a Developer ID Application identity"
            exit 1
          fi
          printf 'APPLE_SIGNING_IDENTITY=%s\n' "$CERT_IDENTITY" >> "$GITHUB_ENV"
          rm -f "$CERTIFICATE_PATH"

      - name: Prepare Apple notarization API key
        if: startsWith(matrix.os, 'macos')
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          printf 'APPLE_API_KEY_PATH=%s\n' "$API_KEY_PATH" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updates are signature-checked. Without these the build still
          # succeeds but produces no `.sig` files, and the updater rejects it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Zenoh Explorer ${{ inputs.tag || github.ref_name }}
          releaseBody: |
            See the assets below to download this version.
          # Published by hand after checking the artifacts. A bad build is then
          # a deleted draft rather than something already on people's machines.
          releaseDraft: true
          prerelease: false
          # `uploadUpdaterJson` (on by default) writes `latest.json` into the
          # release, which is what the endpoint in tauri.updater.conf.json
          # points at.
          args: >-
            --target ${{ matrix.target }}
            --features updater
            --config src-tauri/tauri.updater.conf.json

      # The exclude list belongs to upstream, so check the property we rely
      # on rather than trusting the tool that is supposed to provide it.
      - name: Verify the AppImage leaves libwayland-client to the host
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          appimage="$(find "target/${{ matrix.target }}/release/bundle/appimage" -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          appimage="$(readlink -f "$appimage")"
          cd "$RUNNER_TEMP"
          "$appimage" --appimage-extract >/dev/null
          if [ -e squashfs-root/usr/lib/libwayland-client.so.0 ]; then
            echo "::error::The AppImage bundles libwayland-client.so.0 and will not open a window on Mesa 25 or newer"
            exit 1
          fi

      - name: Verify macOS signature and notarization
        if: startsWith(matrix.os, 'macos')
        run: |
          APP_PATH="target/${{ matrix.target }}/release/bundle/macos/Zenoh Explorer.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Contents/Resources/licenses/LICENSE"
          test -f "$APP_PATH/Contents/Resources/licenses/NOTICE"
          test -f "$APP_PATH/Contents/Resources/licenses/DISTRIBUTION_LICENSES.txt"
          codesign --display --verbose=4 "$APP_PATH"
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

      - name: Verify Linux license payloads
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          for package in target/${{ matrix.target }}/release/bundle/deb/*.deb; do
            dpkg-deb --fsys-tarfile "$package" |
              tar -tf - |
              grep -Eq '^(\./)?usr/share/doc/zenoh-explorer/copyright$'
          done

          for appimage in target/${{ matrix.target }}/release/bundle/appimage/*.AppImage; do
            chmod +x "$appimage"
            "$appimage" --appimage-extract \
              usr/share/licenses/zenoh-explorer/DISTRIBUTION_LICENSES.txt
            test -f squashfs-root/usr/share/licenses/zenoh-explorer/DISTRIBUTION_LICENSES.txt
            rm -rf squashfs-root
          done

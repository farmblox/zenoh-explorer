name: Feature request
description: Suggest something the explorer should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to find out?
      description: |
        Describe the debugging question, not the UI. "I need to know which
        router a peer is going through" tells us more than "add a dropdown".
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: How you imagine it working
      description: Optional. A sketch, a screenshot from another tool, anything.

  - type: input
    id: zenoh-feature
    attributes:
      label: Relevant Zenoh mechanism
      description: If you know where the data lives (an admin-space key, a Zenoh API), say so.
      placeholder: "@/*/*/route/successor/**"
